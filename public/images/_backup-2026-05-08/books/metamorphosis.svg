<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0d0a07"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="200" height="280" fill="url(#bg)"/>
  <rect width="200" height="280" fill="url(#glow)"/>
  <rect x="10" y="10" width="180" height="260" fill="none" stroke="#3d3024" stroke-width="1"/>
  <rect x="16" y="16" width="168" height="248" fill="none" stroke="#5a4a38" stroke-width="0.5"/>
  <!-- beetle body -->
  <ellipse cx="100" cy="125" rx="30" ry="42" fill="none" stroke="#c9a96e" stroke-width="1.5" opacity="0.9"/>
  <ellipse cx="100" cy="125" rx="28" ry="40" fill="#1a1410" stroke="none"/>
  <ellipse cx="100" cy="125" rx="30" ry="42" fill="none" stroke="#c9a96e" stroke-width="1.2"/>
  <!-- head -->
  <ellipse cx="100" cy="80" rx="16" ry="12" fill="none" stroke="#c9a96e" stroke-width="1.2"/>
  <!-- wing split -->
  <line x1="100" y1="88" x2="100" y2="167" stroke="#9e8455" stroke-width="0.8"/>
  <!-- wing detail lines -->
  <path d="M80 110 Q90 115 100 112" fill="none" stroke="#9e8455" stroke-width="0.5" opacity="0.6"/>
  <path d="M120 110 Q110 115 100 112" fill="none" stroke="#9e8455" stroke-width="0.5" opacity="0.6"/>
  <path d="M78 135 Q90 140 100 137" fill="none" stroke="#9e8455" stroke-width="0.5" opacity="0.6"/>
  <path d="M122 135 Q110 140 100 137" fill="none" stroke="#9e8455" stroke-width="0.5" opacity="0.6"/>
  <!-- legs -->
  <line x1="70" y1="105" x2="52" y2="90" stroke="#9e8455" stroke-width="1" opacity="0.7"/>
  <line x1="130" y1="105" x2="148" y2="90" stroke="#9e8455" stroke-width="1" opacity="0.7"/>
  <line x1="68" y1="125" x2="44" y2="125" stroke="#9e8455" stroke-width="1" opacity="0.7"/>
  <line x1="132" y1="125" x2="156" y2="125" stroke="#9e8455" stroke-width="1" opacity="0.7"/>
  <line x1="70" y1="148" x2="50" y2="165" stroke="#9e8455" stroke-width="1" opacity="0.7"/>
  <line x1="130" y1="148" x2="150" y2="165" stroke="#9e8455" stroke-width="1" opacity="0.7"/>
  <!-- antennae -->
  <path d="M88 72 Q76 50 62 40" fill="none" stroke="#c9a96e" stroke-width="0.8" opacity="0.8"/>
  <path d="M112 72 Q124 50 138 40" fill="none" stroke="#c9a96e" stroke-width="0.8" opacity="0.8"/>
  <!-- title -->
  <line x1="60" y1="205" x2="140" y2="205" stroke="#3d3024" stroke-width="0.5"/>
  <text x="100" y="225" font-family="serif" font-size="14" fill="#c9a96e" text-anchor="middle" letter-spacing="4">变形记</text>
  <text x="100" y="245" font-family="serif" font-size="9" fill="#7a6b5a" text-anchor="middle" letter-spacing="2">KAFKA</text>
  <line x1="60" y1="255" x2="140" y2="255" stroke="#3d3024" stroke-width="0.5"/>
</svg>
