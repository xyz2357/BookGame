<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0d0a07"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="#e6c87a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="200" height="280" fill="url(#bg)"/>
  <rect width="200" height="280" fill="url(#glow)"/>
  <rect x="10" y="10" width="180" height="260" fill="none" stroke="#3d3024" stroke-width="1"/>
  <rect x="16" y="16" width="168" height="248" fill="none" stroke="#5a4a38" stroke-width="0.5"/>
  <!-- ornate picture frame -->
  <rect x="50" y="40" width="100" height="130" fill="none" stroke="#c9a96e" stroke-width="2"/>
  <rect x="55" y="45" width="90" height="120" fill="none" stroke="#9e8455" stroke-width="0.5"/>
  <!-- corner ornaments -->
  <path d="M50 40 Q45 35 40 40 Q45 45 50 40" fill="#c9a96e" opacity="0.5"/>
  <path d="M150 40 Q155 35 160 40 Q155 45 150 40" fill="#c9a96e" opacity="0.5"/>
  <path d="M50 170 Q45 165 40 170 Q45 175 50 170" fill="#c9a96e" opacity="0.5"/>
  <path d="M150 170 Q155 165 160 170 Q155 175 150 170" fill="#c9a96e" opacity="0.5"/>
  <!-- portrait silhouette inside frame -->
  <ellipse cx="100" cy="80" rx="18" ry="22" fill="none" stroke="#9e8455" stroke-width="0.8" opacity="0.4"/>
  <!-- shoulders -->
  <path d="M70 120 Q80 105 100 102 Q120 105 130 120 L130 165 L70 165 Z" fill="none" stroke="#9e8455" stroke-width="0.6" opacity="0.3"/>
  <!-- crack/decay lines on the portrait -->
  <path d="M85 70 L78 90 L90 100" fill="none" stroke="#8b3a3a" stroke-width="0.5" opacity="0.6"/>
  <path d="M115 75 L120 85 L112 95" fill="none" stroke="#8b3a3a" stroke-width="0.5" opacity="0.6"/>
  <path d="M95 100 L88 115 L95 125" fill="none" stroke="#8b3a3a" stroke-width="0.5" opacity="0.5"/>
  <!-- eyes in the portrait -->
  <circle cx="92" cy="78" r="2" fill="#c9a96e" opacity="0.4"/>
  <circle cx="108" cy="78" r="2" fill="#c9a96e" opacity="0.4"/>
  <!-- title -->
  <line x1="40" y1="200" x2="160" y2="200" stroke="#3d3024" stroke-width="0.5"/>
  <text x="100" y="220" font-family="serif" font-size="11" fill="#c9a96e" text-anchor="middle" letter-spacing="1">道林·格雷的画像</text>
  <text x="100" y="240" font-family="serif" font-size="9" fill="#7a6b5a" text-anchor="middle" letter-spacing="1">OSCAR WILDE</text>
  <line x1="40" y1="250" x2="160" y2="250" stroke="#3d3024" stroke-width="0.5"/>
</svg>
