<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0d0a07"/>
    </linearGradient>
    <radialGradient id="lamplight" cx="42%" cy="35%" r="25%">
      <stop offset="0%" stop-color="#e6c87a" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#c9a96e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#lamplight)"/>
  <!-- desk -->
  <rect x="150" y="180" width="250" height="8" fill="#3d3024" stroke="#5a4a38" stroke-width="0.5"/>
  <!-- desk legs -->
  <line x1="165" y1="188" x2="165" y2="280" stroke="#3d3024" stroke-width="3"/>
  <line x1="385" y1="188" x2="385" y2="280" stroke="#3d3024" stroke-width="3"/>
  <!-- lamp base -->
  <rect x="230" y="162" width="20" height="18" fill="#3d3024" stroke="#5a4a38" stroke-width="0.5" rx="1"/>
  <!-- lamp arm -->
  <line x1="240" y1="162" x2="240" y2="120" stroke="#9e8455" stroke-width="1.5"/>
  <!-- lampshade -->
  <path d="M222 120 L258 120 L250 100 L230 100 Z" fill="none" stroke="#c9a96e" stroke-width="1"/>
  <!-- light cone -->
  <path d="M225 120 L190 185 L290 185 L275 120" fill="#e6c87a" opacity="0.04"/>
  <!-- paper on desk -->
  <rect x="260" y="168" width="30" height="14" fill="none" stroke="#c9a96e" stroke-width="0.8" opacity="0.6" transform="rotate(-5,275,175)"/>
  <!-- fold line on paper -->
  <line x1="275" y1="169" x2="275" y2="181" stroke="#9e8455" stroke-width="0.3" opacity="0.4" transform="rotate(-5,275,175)"/>
  <!-- tea stain on desk -->
  <circle cx="340" cy="176" r="12" fill="none" stroke="#5a4a38" stroke-width="0.5" opacity="0.3"/>
  <circle cx="342" cy="174" r="10" fill="none" stroke="#5a4a38" stroke-width="0.3" opacity="0.2"/>
  <!-- cup -->
  <path d="M335 164 L330 180 L350 180 L345 164 Z" fill="none" stroke="#9e8455" stroke-width="0.8" opacity="0.4"/>
  <!-- chair behind desk -->
  <rect x="440" y="150" width="40" height="60" fill="none" stroke="#3d3024" stroke-width="1" rx="2" opacity="0.4"/>
  <line x1="445" y1="210" x2="445" y2="270" stroke="#3d3024" stroke-width="2" opacity="0.3"/>
  <line x1="475" y1="210" x2="475" y2="270" stroke="#3d3024" stroke-width="2" opacity="0.3"/>
  <!-- fluorescent light (buzzing) -->
  <rect x="200" y="15" width="200" height="4" fill="#e8dcc8" opacity="0.08"/>
  <line x1="200" y1="19" x2="200" y2="30" stroke="#5a4a38" stroke-width="0.5" opacity="0.3"/>
  <line x1="400" y1="19" x2="400" y2="30" stroke="#5a4a38" stroke-width="0.5" opacity="0.3"/>
</svg>
