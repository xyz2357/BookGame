<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0a07"/>
      <stop offset="100%" stop-color="#0d0a07"/>
    </linearGradient>
    <radialGradient id="dim" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#2a2118" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#dim)"/>
  <!-- collapsed shelves - broken wood beams -->
  <line x1="180" y1="80" x2="350" y2="220" stroke="#3d3024" stroke-width="6" opacity="0.5"/>
  <line x1="200" y1="60" x2="380" y2="240" stroke="#3d3024" stroke-width="4" opacity="0.4"/>
  <line x1="280" y1="40" x2="420" y2="200" stroke="#5a4a38" stroke-width="3" opacity="0.3"/>
  <!-- broken shelf horizontal -->
  <line x1="150" y1="140" x2="320" y2="155" stroke="#3d3024" stroke-width="2" opacity="0.4"/>
  <line x1="300" y1="180" x2="450" y2="170" stroke="#3d3024" stroke-width="2" opacity="0.35"/>
  <!-- scattered books on ground -->
  <rect x="220" y="230" width="25" height="6" fill="#3d3024" opacity="0.4" transform="rotate(15,232,233)"/>
  <rect x="280" y="245" width="20" height="5" fill="#5a4a38" opacity="0.35" transform="rotate(-25,290,248)"/>
  <rect x="340" y="235" width="22" height="7" fill="#3d3024" opacity="0.3" transform="rotate(8,351,238)"/>
  <rect x="190" y="250" width="18" height="5" fill="#5a4a38" opacity="0.25" transform="rotate(-12,199,253)"/>
  <!-- scattered pages -->
  <rect x="260" y="255" width="12" height="9" fill="none" stroke="#9e8455" stroke-width="0.4" opacity="0.2" transform="rotate(20,266,260)"/>
  <rect x="370" y="248" width="10" height="8" fill="none" stroke="#9e8455" stroke-width="0.4" opacity="0.15" transform="rotate(-15,375,252)"/>
  <!-- remaining upright shelf on left -->
  <line x1="100" y1="0" x2="130" y2="300" stroke="#5a4a38" stroke-width="2" opacity="0.5"/>
  <line x1="80" y1="60" x2="130" y2="60" stroke="#3d3024" stroke-width="1" opacity="0.3"/>
  <line x1="85" y1="120" x2="130" y2="120" stroke="#3d3024" stroke-width="1" opacity="0.3"/>
  <line x1="90" y1="180" x2="130" y2="180" stroke="#3d3024" stroke-width="1" opacity="0.3"/>
  <!-- smoke/dust wisps -->
  <path d="M400 200 Q420 180 410 160 Q430 140 420 120" fill="none" stroke="#9e8455" stroke-width="0.5" opacity="0.1"/>
  <path d="M440 220 Q455 195 445 170 Q460 150 450 130" fill="none" stroke="#9e8455" stroke-width="0.4" opacity="0.08"/>
  <!-- faint burnt smell visual - ember dots -->
  <circle cx="380" cy="260" r="1.5" fill="#8b3a3a" opacity="0.15"/>
  <circle cx="400" cy="250" r="1" fill="#8b3a3a" opacity="0.1"/>
  <circle cx="360" cy="270" r="0.8" fill="#8b3a3a" opacity="0.12"/>
</svg>
