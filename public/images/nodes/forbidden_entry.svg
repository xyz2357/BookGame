<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0d0a07"/>
    </linearGradient>
    <radialGradient id="doorglow" cx="50%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#doorglow)"/>
  <!-- wall -->
  <rect x="120" y="0" width="360" height="300" fill="none" stroke="#3d3024" stroke-width="1" opacity="0.3"/>
  <!-- iron door frame -->
  <rect x="220" y="20" width="160" height="260" fill="#1a1410" stroke="#5a4a38" stroke-width="2.5"/>
  <!-- door inner panel -->
  <rect x="230" y="30" width="140" height="240" fill="none" stroke="#3d3024" stroke-width="1"/>
  <!-- door rivets -->
  <circle cx="235" cy="35" r="3" fill="#5a4a38" opacity="0.5"/>
  <circle cx="365" cy="35" r="3" fill="#5a4a38" opacity="0.5"/>
  <circle cx="235" cy="265" r="3" fill="#5a4a38" opacity="0.5"/>
  <circle cx="365" cy="265" r="3" fill="#5a4a38" opacity="0.5"/>
  <circle cx="235" cy="150" r="3" fill="#5a4a38" opacity="0.5"/>
  <circle cx="365" cy="150" r="3" fill="#5a4a38" opacity="0.5"/>
  <!-- door crack (slightly ajar) -->
  <line x1="380" y1="25" x2="382" y2="275" stroke="#0d0a07" stroke-width="3"/>
  <line x1="381" y1="25" x2="383" y2="275" stroke="#2a2118" stroke-width="1" opacity="0.5"/>
  <!-- faded seal/tape across door -->
  <rect x="210" y="110" width="180" height="18" fill="none" stroke="#8b3a3a" stroke-width="1" opacity="0.4" transform="rotate(-3,300,119)"/>
  <!-- seal text -->
  <text x="300" y="123" font-family="serif" font-size="10" fill="#8b3a3a" text-anchor="middle" opacity="0.35" transform="rotate(-3,300,123)" letter-spacing="8">禁止进入</text>
  <!-- second seal (torn) -->
  <line x1="215" y1="155" x2="310" y2="152" stroke="#8b3a3a" stroke-width="0.8" opacity="0.25"/>
  <path d="M310 152 Q315 148 320 152 Q325 155 320 158" fill="none" stroke="#8b3a3a" stroke-width="0.5" opacity="0.2"/>
  <!-- door handle -->
  <circle cx="360" cy="150" r="8" fill="none" stroke="#9e8455" stroke-width="1.5" opacity="0.5"/>
  <circle cx="360" cy="150" r="3" fill="#5a4a38" opacity="0.3"/>
  <!-- light leaking through crack -->
  <path d="M382 80 L395 75 L395 85 Z" fill="#e6c87a" opacity="0.03"/>
  <path d="M382 150 L398 145 L398 158 Z" fill="#e6c87a" opacity="0.04"/>
  <path d="M382 220 L392 216 L392 226 Z" fill="#e6c87a" opacity="0.02"/>
  <!-- wall texture - stone lines -->
  <line x1="130" y1="60" x2="220" y2="60" stroke="#3d3024" stroke-width="0.5" opacity="0.2"/>
  <line x1="130" y1="130" x2="220" y2="130" stroke="#3d3024" stroke-width="0.5" opacity="0.2"/>
  <line x1="130" y1="200" x2="220" y2="200" stroke="#3d3024" stroke-width="0.5" opacity="0.2"/>
  <line x1="380" y1="60" x2="470" y2="60" stroke="#3d3024" stroke-width="0.5" opacity="0.2"/>
  <line x1="380" y1="130" x2="470" y2="130" stroke="#3d3024" stroke-width="0.5" opacity="0.2"/>
  <line x1="380" y1="200" x2="470" y2="200" stroke="#3d3024" stroke-width="0.5" opacity="0.2"/>
  <!-- single book on shelf behind door (barely visible through crack) -->
  <rect x="385" y="148" width="3" height="8" fill="#c9a96e" opacity="0.06"/>
</svg>
