<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#1a1410"/>
  <rect x="80" y="80" width="352" height="352" rx="32" fill="#0d0a07" stroke="#3d3024" stroke-width="2"/>
  <!-- Book body -->
  <g transform="translate(256, 256)">
    <!-- Left page -->
    <path d="M-8,-100 L-8,100 Q-8,108 -16,108 L-100,108 Q-108,108 -108,100 L-108,-100 Q-108,-108 -100,-108 L-16,-108 Q-8,-108 -8,-100 Z" fill="#2a2118" stroke="#5a4a38" stroke-width="1.5"/>
    <!-- Right page -->
    <path d="M8,-100 L8,100 Q8,108 16,108 L100,108 Q108,108 108,100 L108,-100 Q108,-108 100,-108 L16,-108 Q8,-108 8,-100 Z" fill="#2a2118" stroke="#5a4a38" stroke-width="1.5"/>
    <!-- Spine -->
    <rect x="-8" y="-108" width="16" height="216" fill="#3d3024" rx="2"/>
    <!-- Gold text lines on left page -->
    <line x1="-80" y1="-70" x2="-24" y2="-70" stroke="#c9a96e" stroke-width="2" opacity="0.6"/>
    <line x1="-80" y1="-50" x2="-30" y2="-50" stroke="#c9a96e" stroke-width="2" opacity="0.4"/>
    <line x1="-80" y1="-30" x2="-36" y2="-30" stroke="#c9a96e" stroke-width="2" opacity="0.3"/>
    <line x1="-80" y1="-10" x2="-28" y2="-10" stroke="#c9a96e" stroke-width="2" opacity="0.4"/>
    <line x1="-80" y1="10" x2="-40" y2="10" stroke="#c9a96e" stroke-width="2" opacity="0.3"/>
    <!-- Gold text lines on right page -->
    <line x1="24" y1="-70" x2="80" y2="-70" stroke="#c9a96e" stroke-width="2" opacity="0.6"/>
    <line x1="24" y1="-50" x2="74" y2="-50" stroke="#c9a96e" stroke-width="2" opacity="0.4"/>
    <line x1="24" y1="-30" x2="68" y2="-30" stroke="#c9a96e" stroke-width="2" opacity="0.3"/>
    <line x1="24" y1="-10" x2="76" y2="-10" stroke="#c9a96e" stroke-width="2" opacity="0.4"/>
    <line x1="24" y1="10" x2="64" y2="10" stroke="#c9a96e" stroke-width="2" opacity="0.3"/>
    <!-- Candle flame above book -->
    <ellipse cx="0" cy="-140" rx="8" ry="16" fill="#ffd700" opacity="0.8"/>
    <ellipse cx="0" cy="-138" rx="4" ry="10" fill="#ff8c00" opacity="0.6"/>
    <!-- Candle body -->
    <rect x="-4" y="-126" width="8" height="16" fill="#e8dcc8" rx="1"/>
  </g>
  <!-- Title -->
  <text x="256" y="440" text-anchor="middle" font-family="serif" font-size="36" fill="#c9a96e" opacity="0.8">底层书库</text>
</svg>
